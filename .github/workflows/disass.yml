name: Extract Exact Custom Driver GPIOs

on:
  workflow_dispatch:

jobs:
  extract_gpio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi python3

      - name: Get Exact GPIO Number at 0xc0386680
        run: |
          dd if=bak/nmtd8_NAND.kernel.bin bs=1 skip=27136 2>/dev/null | gzip -dc > vmlinux_full.bin || true
          arm-linux-gnueabi-objdump -D -b binary -m arm --adjust-vma=0xc0008000 --start-address=0xc0386680 --stop-address=0xc0386780 vmlinux_full.bin
