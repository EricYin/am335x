name: Full Kernel & Binary Reverse Engineering

on:
  workflow_dispatch:

jobs:
  full_extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabi python3

      - name: Locate & Disassemble Custom Drivers via movt 0xc080
        run: |
          dd if=bak/nmtd8_NAND.kernel.bin bs=1 skip=27136 2>/dev/null | gzip -dc > vmlinux_full.bin || true
          python3 - << 'EOF'
          import struct, subprocess
          data = open("vmlinux_full.bin", "rb").read()
          hits = []
          # Scan for ARMv7 movt r0..r12, #0xc080 -> word & 0xfff00fff == 0xe3400080
          for off in range(0, len(data) - 4, 4):
              word = struct.unpack_from("<I", data, off)[0]
              if (word & 0xfff00fff) == 0xe3400080:
                  hits.append(off)
          print("Found movt #0xc080 hits at file offsets:", [hex(h) for h in hits])
          if hits:
              # Disassemble a wide window covering all hits (e.g., min-0x800 to max+0x800)
              start = max(0, min(hits) - 0x800)
              stop = min(len(data), max(hits) + 0x800)
              out = subprocess.check_output([
                  "arm-linux-gnueabi-objdump", "-D", "-b", "binary", "-m", "arm",
                  "--adjust-vma=0xc0008000",
                  f"--start-address={hex(0xc0008000 + start)}",
                  f"--stop-address={hex(0xc0008000 + stop)}",
                  "vmlinux_full.bin"
              ], text=True)
              print(f"Disassembled {hex(0xc0008000+start)} .. {hex(0xc0008000+stop)} ({len(out.splitlines())} lines)")
              print(out)
          EOF
