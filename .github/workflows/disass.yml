name: Extract Exact Custom Driver GPIOs

on:
  workflow_dispatch:

jobs:
  extract_gpio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi python3
 
      - name: Extract and Decompile Stock DTB to DTS
        run: |
          sudo apt-get update && sudo apt-get install -y device-tree-compiler python3
          python3 - << 'EOF'
          import struct, subprocess

          raw = open("bak/nmtd8_NAND.kernel.bin", "rb").read()
          magic = b"\xd0\x0d\xfe\xed"
          pos = 0
          idx = 0
          while (off := raw.find(magic, pos)) != -1:
              totalsize = struct.unpack(">I", raw[off+4:off+8])[0]
              if 1024 < totalsize < 1024 * 1024 and off + totalsize <= len(raw):
                  dtb_name = f"stock_{idx}.dtb"
                  dts_name = f"stock_{idx}.dts"
                  open(dtb_name, "wb").write(raw[off : off + totalsize])
                  print(f"=== Found DTB #{idx} at offset {hex(off)}, size={totalsize} ===")
                  res = subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", dts_name, dtb_name], capture_output=True, text=True)
                  if res.returncode == 0:
                      content = open(dts_name).read()
                      # 直接打印 serial / uart / gpio / bt / gps / led 相关节点，并保存完整 dts 供查看
                      for line in content.splitlines():
                          if any(k in line.lower() for k in ["serial@", "uart", "uart_sel", "gpio", "bt", "gps", "kim", "led", "pca953"]):
                              print(line)
                      print(f"\n--- Full {dts_name} saved ({len(content)} chars) ---")
                  else:
                      print("dtc error:", res.stderr)
                  idx += 1
              pos = off + 4
          EOF
          # 直接输出提取到的第一个完整原厂 DTS 里的 serial 和 gpio 节点详情
          python3 - << 'EOF'
          import glob, re
          for f in sorted(glob.glob("stock_*.dts")):
              print(f"\n==================== {f} (Serial & Custom Nodes) ====================")
              txt = open(f).read()
              # 打印所有 serial@ 块以及根节点下的自定义节点
              for m in re.finditer(r'(serial@[0-9a-f]+\s*\{[^}]*\}|am335x_[a-z0-9_]+\s*\{[^}]*\})', txt):
                  print(m.group(0))
          EOF
