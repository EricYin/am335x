name: Extract Exact Custom Driver GPIOs

on:
  workflow_dispatch:

jobs:
  extract_gpio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi python3

      - name: Strip NAND OOB & Extract Real vmlinux
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi xz-utils lzop python3
          python3 - << 'EOF'
          import os, struct, subprocess, re

          raw = open("bak/nmtd8_NAND.kernel.bin", "rb").read()
          print("Raw file size:", len(raw))

          # 1. 自动检测并剥离 NAND OOB (常见 2048+64=2112 或 4096+128/224)
          clean = raw
          for page, oob in [(2048, 64), (4096, 128), (4096, 224), (512, 16)]:
              stride = page + oob
              if len(raw) % stride == 0 and raw[0:4] == b"\x27\x05\x19\x56":
                  print(f"Detected NAND OOB format: {page}+{oob}, stripping OOB...")
                  clean = b"".join(raw[i:i+page] for i in range(0, len(raw), stride))
                  break
              # 即使前几页是全FF坏块，只要 uImage magic 出现在页对齐处也剥离
              if len(raw) % stride == 0:
                  for p_idx in range(16):
                      if raw[p_idx*stride : p_idx*stride+4] == b"\x27\x05\x19\x56":
                          print(f"Detected uImage at page {p_idx} with {page}+{oob}, stripping OOB...")
                          clean = b"".join(raw[i:i+page] for i in range(p_idx*stride, len(raw), stride))
                          break

          open("kernel_clean.bin", "wb").write(clean)
          print("Clean kernel image size:", len(clean))

          # 2. 在剥离 OOB 后的镜像中定位压缩内核流并解压
          vmlinux = b""
          # 尝试 gzip
          for i in range(len(clean) - 4):
              if clean[i:i+3] == b"\x1f\x8b\x08":
                  p = subprocess.run(["gzip", "-dc"], input=clean[i:], capture_output=True)
                  if len(p.stdout) > 2_000_000:
                      print(f"Decompressed gzip at {hex(i)} -> {len(p.stdout)} bytes")
                      vmlinux = p.stdout
                      break
          # 尝试 xz
          if not vmlinux:
              for i in range(len(clean) - 6):
                  if clean[i:i+6] == b"\xfd7zXZ\x00":
                      p = subprocess.run(["xz", "-dc"], input=clean[i:], capture_output=True)
                      if len(p.stdout) > 2_000_000:
                          print(f"Decompressed xz at {hex(i)} -> {len(p.stdout)} bytes")
                          vmlinux = p.stdout
                          break
          # 尝试 lzo
          if not vmlinux:
              for i in range(len(clean) - 9):
                  if clean[i:i+9] == b"\x89LZO\x00\x0d\x0a\x1a\x0a":
                      p = subprocess.run(["lzop", "-dc"], input=clean[i:], capture_output=True)
                      if len(p.stdout) > 2_000_000:
                          print(f"Decompressed lzo at {hex(i)} -> {len(p.stdout)} bytes")
                          vmlinux = p.stdout
                          break

          if not vmlinux:
              print("ERROR: Failed to decompress vmlinux. First 64 bytes:", clean[:64].hex())
              exit(1)

          open("vmlinux_real.bin", "wb").write(vmlinux)

          # 3. 搜索所有包含 sel / bt / gpio / uart / am335 / c3000 的驱动字符串及引用地址
          for m in re.finditer(b"[\x20-\x7e]{4,60}", vmlinux):
              s = m.group()
              sl = s.lower()
              if any(k in sl for k in [b"am335x_", b"c3000", b"_sel", b"bt_", b"bluetooth", b"kim", b"uart3"]):
                  if b" " not in s and len(s) < 40:
                      print(f"VA {hex(0xc0008000 + m.start())}: {s.decode()}")
          EOF
