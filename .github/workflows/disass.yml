name: Extract Exact Custom Driver GPIOs

on:
  workflow_dispatch:

jobs:
  extract_gpio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi python3

      - name: Disassemble Custom Board Drivers (0xc07ff000..0xc0800300)
        run: |
          dd if=bak/nmtd8_NAND.kernel.bin bs=1 skip=27136 2>/dev/null | gzip -dc > vmlinux_full.bin || true
          python3 - << 'EOF'
          import subprocess
          data = open("vmlinux_full.bin", "rb").read()
          
          hits = []
          for off in range(4, len(data) - 4, 4):
              w = int.from_bytes(data[off:off+4], "little")
              prev = int.from_bytes(data[off-4:off], "little")
              if (prev & 0xfff00000) == 0xe3000000:
                  imm16 = ((prev & 0xf0000) >> 4) | (prev & 0xfff)
                  # Match 0xc07ff000..0xc07fffff or 0xc0800000..0xc0800300
                  if ((w & 0xfff00fff) == 0xe340007f and imm16 >= 0xf000) or \
                     ((w & 0xfff00fff) == 0xe3400080 and imm16 <= 0x0300):
                      hi = 0xc07f if (w & 0xfff) == 0x7f else 0xc080
                      vaddr = (hi << 16) | imm16
                      s_off = vaddr - 0xc0008000
                      s_end = data.find(b"\x00", s_off)
                      s_val = data[s_off:s_end].decode(errors="ignore")
                      hits.append((off, s_val))
          
          for off, s in hits:
              print(f"Code {hex(0xc0008000+off)} -> \"{s}\"")
          
          if hits:
              start = max(0, min(h[0] for h in hits) - 0x400)
              stop = min(len(data), max(h[0] for h in hits) + 0x600)
              out = subprocess.check_output([
                  "arm-linux-gnueabi-objdump", "-D", "-b", "binary", "-m", "arm",
                  "--adjust-vma=0xc0008000",
                  f"--start-address={hex(0xc0008000 + start)}",
                  f"--stop-address={hex(0xc0008000 + stop)}",
                  "vmlinux_full.bin"
              ], text=True)
              print(out)
          EOF
