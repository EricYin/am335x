name: Extract Exact Custom Driver GPIOs

on:
  workflow_dispatch:

jobs:
  extract_gpio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi python3
 
      - name: Extract uart_sel Code and Stock DTB Together
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi device-tree-compiler python3
          ls -lh bak/
          python3 - << 'EOF'
          import struct, subprocess, glob

          # 1. 解压内核并精确匹配加载 0xc07f7c7c ("uart_sel") 的 ARM movw/movt 指令
          raw = open("bak/nmtd8_NAND.kernel.bin", "rb").read()
          vmlinux = subprocess.run(["gzip", "-dc"], input=raw[0x6a00:], capture_output=True).stdout
          open("vmlinux_real.bin", "wb").write(vmlinux)
          BASE = 0xc0008000

          # 0xc07f7c7c -> low16 = 0x7c7c -> imm4=0x7, imm12=0xc7c -> 0xe307X c7c
          for i in range(0, len(vmlinux) - 4, 4):
              w = int.from_bytes(vmlinux[i:i+4], "little")
              if (w & 0xfff00fff) == 0xe3070c7c:
                  va = BASE + i
                  print(f"=== Found uart_sel (0xc07f7c7c) code ref at VA {hex(va)} ===")
                  print(subprocess.check_output([
                      "arm-linux-gnueabi-objdump", "-D", "-b", "binary", "-m", "arm",
                      f"--adjust-vma={hex(BASE)}",
                      f"--start-address={hex(va - 0x40)}",
                      f"--stop-address={hex(va + 0x160)}",
                      "vmlinux_real.bin"
                  ], text=True))

          # 2. 同时扫描 bak/ 下所有其他分区文件中的原厂 DTB (0xd00dfeed)，直接反编译出 serial/uart_sel 配置
          for path in sorted(glob.glob("bak/*")):
              if "kernel" in path or "file-system" in path:
                  continue
              b = open(path, "rb").read()
              pos = 0
              while (off := b.find(b"\xd0\x0d\xfe\xed", pos)) != -1:
                  sz = struct.unpack(">I", b[off+4:off+8])[0]
                  if 1024 < sz < 512 * 1024 and off + sz <= len(b):
                      open("found.dtb", "wb").write(b[off:off+sz])
                      res = subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "found.dtb"], capture_output=True, text=True)
                      if res.returncode == 0:
                          print(f"\n=== Stock DTB in {path} @ {hex(off)} ===")
                          for line in res.stdout.splitlines():
                              if any(k in line.lower() for k in ["serial@", "uart", "gpio", "bt", "gps", "led", "pca953"]):
                                  print(line)
                  pos = off + 4
          EOF
