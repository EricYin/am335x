name: Extract Exact Custom Driver GPIOs

on:
  workflow_dispatch:

jobs:
  extract_gpio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabi python3
 
      - name: Disassemble uart_sel and Board GPIO Drivers
        run: |
          python3 - << 'EOF'
          import struct, subprocess

          raw = open("bak/nmtd8_NAND.kernel.bin", "rb").read()
          vmlinux = subprocess.run(["gzip", "-dc"], input=raw[0x6a00:], capture_output=True).stdout
          BASE = 0xc0008000

          # 1. 打印 0xc07f7c00 - 0xc07f7d50 以及 0xc0800000 - 0xc0800300 的完整字符串表
          print("=== Strings around uart_sel (0xc07f7c7c) ===")
          print(vmlinux[0xc07f7c00 - BASE : 0xc07f7d50 - BASE])
          print("\n=== Strings around am335x_* drivers (0xc0800000) ===")
          print(vmlinux[0xc0800000 - BASE : 0xc0800300 - BASE])

          def disasm_va(va, before=0x80, after=0x140):
              start = max(BASE, va - before)
              stop = min(BASE + len(vmlinux), va + after)
              out = subprocess.check_output([
                  "arm-linux-gnueabi-objdump", "-D", "-b", "binary", "-m", "arm",
                  f"--adjust-vma={hex(BASE)}",
                  f"--start-address={hex(start)}",
                  f"--stop-address={hex(stop)}",
                  "vmlinux_real.bin"
              ], text=True)
              print(out)

          open("vmlinux_real.bin", "wb").write(vmlinux)

          # 2. 查找所有引用 0xc07f7c7c (uart_sel) 的指针和指令
          targets = [0xc07f7c7c]
          # 同时把 0xc07f7c00..0xc07f7d50 范围内所有以 \x00 结尾的字符串起点都纳入搜索
          chunk = vmlinux[0xc07f7c00 - BASE : 0xc07f7d50 - BASE]
          for i in range(1, len(chunk)):
              if chunk[i-1] == 0 and 0x20 <= chunk[i] <= 0x7e:
                  targets.append(0xc07f7c00 + i)

          for t in sorted(set(targets)):
              s_end = vmlinux.find(b"\x00", t - BASE)
              s_val = vmlinux[t - BASE : s_end].decode("ascii", errors="ignore")
              # 搜 32位指针引用 (文字池 ldr 或结构体)
              ptr = struct.pack("<I", t)
              pos = 0
              while (idx := vmlinux.find(ptr, pos)) != -1:
                  ref_va = BASE + idx
                  print(f"\n>>> Pointer to '{s_val}' ({hex(t)}) found at {hex(ref_va)} <<<")
                  disasm_va(ref_va, before=0xc0, after=0x60)
                  pos = idx + 4

              # 搜 ARM movw rX, #(t & 0xffff)
              low16 = t & 0xffff
              movw_val = 0xe3000000 | (((low16 >> 12) & 0xf) << 16) | (low16 & 0xfff)
              for off in range(0, len(vmlinux) - 4, 4):
                  w = int.from_bytes(vmlinux[off:off+4], "little")
                  if (w & 0xfff00fff) == movw_val:
                      ref_va = BASE + off
                      print(f"\n>>> ARM movw for '{s_val}' ({hex(t)}) at {hex(ref_va)} <<<")
                      disasm_va(ref_va, before=0x40, after=0x140)
          EOF
