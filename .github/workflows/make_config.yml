name:
  Make manual Config

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'repository'
        required: true
        type: string
        default: 'https://github.com/ericyin/openwrt'
      branch:
        description: 'branch'
        required: true
        type: string
        default: 'am335x'

env: 
  REPO_URL: ${{ github.event.inputs.repo }}
  REPO_BRANCH:  ${{ github.event.inputs.branch }}
  CONFIG_FILE: configs/am335x.config
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai

jobs:
  menuconfig:
    name: ⚙️ Menuconfig & Push
    runs-on: ubuntu-22.04
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Init Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 🧬 Update & Install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 🧩 Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config

      - name: ⌨️ SSH connection to Menuconfig
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15

      - name: Upload config files
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: |
            openwrt/.config
