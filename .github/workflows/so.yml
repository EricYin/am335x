name: Disassemble libtcu.so BT Functions

on:
  workflow_dispatch:

jobs:
  disasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM objdump
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabi

      - name: Scan all compressed streams in kernel.bin
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabi lzop xz-utils python3
          python3 -c '
          import zlib, subprocess, re
          data = open("bak/nmtd8_NAND.kernel.bin", "rb").read()
          
          # 搜索所有 gzip 魔数 (1f 8b 08)
          for m in re.finditer(b"\x1f\x8b\x08", data):
              off = m.start()
              try:
                  d = zlib.decompressobj(16 + zlib.MAX_WBITS)
                  out = d.decompress(data[off:])
                  if len(out) > 1000000:
                      print(f"Found gzip vmlinux at {hex(off)}, size={len(out)}")
                      open("vmlinux_full.bin", "wb").write(out)
              except Exception:
                  pass
          '
          ls -lh vmlinux_full.bin
          strings -t x vmlinux_full.bin | grep -iE "am335x_sel|am335x_gprs|am335x_led|am335x_buzzer|sel_ioctl" || true


      - name: Disassemble GetDeviceType & M536x
        run: |
          arm-linux-gnueabi-objdump -d bak/libtcu.so | awk '
            /<(GetDeviceType|init_m536x|check_m536x)>:/ { p=1 }
            /^$/ { p=0 }
            p { print }
          '
          echo "=== STRINGS NEAR C3000 / C2000 ==="
          arm-linux-gnueabi-objdump -s -j .rodata bak/libtcu.so | grep -C 6 -E "C3000|C2000|ttyUSB"
   
      
      - name: Disassemble init_n303 & GPS/GPIO functions
        run: |
          arm-linux-gnueabi-objdump -d bak/libtcu.so | awk '
            /<(init_n303|stop_n303|SetExIOOutState|InitBDGPS|do_exit_gps|set_gpio|get_gpio)>:/ { p=1 }
            /^$/ { p=0 }
            p { print }
          '
          echo "=== STRINGS NEAR GPIO/SYSFS ==="
          arm-linux-gnueabi-objdump -s -j .rodata bak/libtcu.so | grep -C 4 -E "gpio|class|value|direction|n303|N303"

      
      - name: Disassemble BT functions
        run: |
          arm-linux-gnueabi-objdump -d bak/libtcu.so | awk '
            /<(init_n303|stop_n303|SelectBT|open_bt_port|set_bt_opt|CheckBT|set_speed|set_parity)>:/ { p=1 }
            /^$/ { p=0 }
            p { print }
          '
          echo "=== RODATA STRINGS ==="
          arm-linux-gnueabi-objdump -s -j .rodata bak/libtcu.so | grep -C 3 "TTM"
          
      - name: Disassemble BT functions 2
        run: |
          arm-linux-gnueabi-objdump -s -j .rodata bak/libtcu.so | awk '
            /^ 11[de]/ || /^ 13[567]/ { print }
          '
