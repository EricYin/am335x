name: Build OpenWrt for AM335x C3000A

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt 分支或标签 (例如 main 或 v25.12.0)'
        required: true
        default: 'am335x'

env:
  REPO_URL: https://github.com/ericyin/openwrt.git
  TARGET_BOARD: ti_am335x-c3000a

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 0. 清理 Runner 冗余磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 1. 检出自定义 DTS 与 files 仓库
        uses: actions/checkout@v4
        with:
          path: c3000a_repo

      - name: 2. 安装 OpenWrt 编译环境依赖
        run: |
          sudo apt-get update && sudo apt-get install -y \
             bc binutils bison build-essential bzip2 ccache clang cmake cpio curl \
             device-tree-compiler dwarves file flex gawk gcc-multilib g++-multilib \
             gettext git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
             libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
             libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
             ninja-build p7zip-full patch pkgconf python3 python3-docutils python3-pip \
             python3-ply python3-pyelftools python3-setuptools qemu-utils quilt re2c \
             rsync scons squashfs-tools subversion swig texinfo time unzip wget \
             xmlto xxd zlib1g-dev zstd

      - name: 3. 克隆 OpenWrt 源码
        run: |
          BRANCH="${{ github.event.inputs.openwrt_branch || 'am335x' }}"
          git clone --depth 1 -b "$BRANCH" "$REPO_URL" openwrt

      - name: 4. 恢复源码包缓存 (dl)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ github.event.inputs.openwrt_branch || 'am335x' }}-${{ hashFiles('c3000a_repo/configs/am335x.config') }}
          restore-keys: |
            openwrt-dl-${{ github.event.inputs.openwrt_branch || 'am335x' }}-
            openwrt-dl-

      - name: 5. 恢复工具链与编译缓存 (staging_dir & ccache)
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/.ccache
          key: openwrt-toolchain-${{ github.event.inputs.openwrt_branch || 'am335x' }}-${{ hashFiles('c3000a_repo/configs/am335x.config') }}
          restore-keys: |
            openwrt-toolchain-${{ github.event.inputs.openwrt_branch || 'am335x' }}-
            openwrt-toolchain-

      - name: 6. 更新并安装 Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 7. 生成编译配置 (.config) 并启用 ccache
        run: |
          rm -rf openwrt/tmp
          cp -v c3000a_repo/configs/am335x.config openwrt/.config
          if [ -d "c3000a_repo/files" ]; then
            cp -rv c3000a_repo/files openwrt/files
          fi
          echo "CONFIG_CCACHE=y" >> openwrt/.config
          cd openwrt && make defconfig
          [ -e .config ] && cp .config defconfig-final.config

      - name: 8. 上传 config files
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: |
            openwrt/defconfig-final.config

      - name: 9. 预下载源码包并准备内核源码
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \;
          make target/linux/prepare V=s
          yes "" | make target/linux/prepare V=s


      - name: 10. 编译固件
        working-directory: openwrt
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          ccache -M 5G
          make -j$(nproc) || make -j1 V=s
          ccache -s

      - name: 11. 整理并上传 SD 卡固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-am335x-c3000a-sdcard
          if-no-files-found: error
          path: |
            openwrt/bin/targets/omap/generic/*ti_am335x-c3000a*
            openwrt/bin/targets/omap/generic/sha256sums
